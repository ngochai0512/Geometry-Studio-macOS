name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      SCHEME: GeometryStudio
      PROJECT: GeometryStudio.xcodeproj
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          MISSING=()
          [ -n "${CERTIFICATE_P12:-}" ] || MISSING+=("DEVELOPER_ID_P12")
          [ -n "${CERTIFICATE_PASSWORD:-}" ] || MISSING+=("DEVELOPER_ID_P12_PASSWORD")
          [ -n "${TEAM_ID:-}" ] || MISSING+=("APPLE_TEAM_ID")
          [ -n "${APPLE_ID:-}" ] || MISSING+=("APPLE_ID")
          [ -n "${APPLE_APP_PASSWORD:-}" ] || MISSING+=("APPLE_APP_PASSWORD")

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarization secrets are configured."
          elif [ "${#MISSING[@]}" -eq 5 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned release::No signing secrets configured. Publishing an unsigned app."
          else
            # Half-configured signing is a mistake worth failing on: silently
            # shipping unsigned would look like a regression.
            echo "error: incomplete signing configuration; missing: ${MISSING[*]}" >&2
            exit 1
          fi

      - name: Validate checked-in project
        run: |
          set -euo pipefail
          PBXPROJ=GeometryStudio.xcodeproj/project.pbxproj

          VERSION=$(sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' "$PBXPROJ" | head -n 1)
          echo "checked-in objectVersion: ${VERSION:-missing}"
          if [ -z "${VERSION:-}" ]; then
            echo "error: $PBXPROJ has no objectVersion" >&2
            exit 1
          fi
          if [ "$VERSION" -lt 77 ]; then
            echo "error: objectVersion $VERSION is older than the 77 floor" >&2
            exit 1
          fi

          if grep -q "RECOMMENDED_MACOSX_DEPLOYMENT_TARGET" "$PBXPROJ"; then
            echo 'error: deployment target was rewritten to $(RECOMMENDED_MACOSX_DEPLOYMENT_TARGET)' >&2
            exit 1
          fi
          if ! grep -q "MACOSX_DEPLOYMENT_TARGET = 27.0;" "$PBXPROJ"; then
            echo "error: expected MACOSX_DEPLOYMENT_TARGET = 27.0" >&2
            exit 1
          fi

          # Xcode upgrades the project in place; the release archives it as
          # checked in rather than regenerating over that upgrade.

      - name: Test package
        run: swift test -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "$CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Archive app
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SIGNS=()
          if [ "$SIGNED" = "true" ]; then
            SIGNS+=("DEVELOPMENT_TEAM=$TEAM_ID")
            SIGNS+=("CODE_SIGN_STYLE=Manual")
            SIGNS+=("CODE_SIGN_IDENTITY=Developer ID Application")
            SIGNS+=("PROVISIONING_PROFILE_SPECIFIER=")
            SIGNS+=("OTHER_CODE_SIGN_FLAGS=--timestamp")
          else
            SIGNS+=("CODE_SIGNING_ALLOWED=NO")
            SIGNS+=("CODE_SIGNING_REQUIRED=NO")
            SIGNS+=("CODE_SIGN_IDENTITY=")
          fi
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/GeometryStudio.xcarchive \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${SIGNS[@]}"

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP=$(find build/GeometryStudio.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "build/GeometryStudio-$VERSION.zip"

          xcrun notarytool submit "build/GeometryStudio-$VERSION.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          ditto -c -k --keepParent "$APP" "build/GeometryStudio-$VERSION.zip"
          (cd build && shasum -a 256 "GeometryStudio-$VERSION.zip" > checksums.txt)

      - name: Package unsigned app
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP=$(find build/GeometryStudio.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          NAME="GeometryStudio-$VERSION-unsigned.zip"
          ditto -c -k --keepParent "$APP" "build/$NAME"
          (cd build && shasum -a 256 "$NAME" > checksums.txt)

      - name: Create DMG
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP=$(find build/GeometryStudio.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/$(basename "$APP")"
          ln -s /Applications "$STAGE/Applications"

          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then
            SUFFIX="-unsigned"
          fi
          DMG="build/GeometryStudio-$VERSION$SUFFIX.dmg"
          # Folder-based images still need hdiutil on macOS 27: diskutil image
          # create from only accepts disks and existing images.
          hdiutil create -volname "Geometry Studio" -fs HFS+ -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          (cd build && shasum -a 256 "$(basename "$DMG")" >> checksums.txt)

      - name: Notarize DMG
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="build/GeometryStudio-$VERSION.dmg"
          test -f "$DMG"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=()
          if [ "$SIGNED" = "true" ]; then
            NOTES+=(--generate-notes)
          else
            NOTES+=(--notes "Unsigned development build: no Developer ID certificate is configured, so macOS Gatekeeper warns on first launch. See RELEASING.md.")
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/GeometryStudio-*.zip \
            build/GeometryStudio-*.dmg \
            build/checksums.txt \
            --title "Geometry Studio ${GITHUB_REF_NAME#v}" \
            "${NOTES[@]}"
