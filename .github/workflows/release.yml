name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      SCHEME: GeometryStudio
      PROJECT: GeometryStudio.xcodeproj
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Normalize Xcode project format
        run: |
          set -euo pipefail
          PBXPROJ=GeometryStudio.xcodeproj/project.pbxproj
          BASELINE=77

          version() {
            sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' "$PBXPROJ" | head -n 1
          }

          CHECKED_IN=$(version)
          echo "checked-in objectVersion: ${CHECKED_IN:-missing}"

          if [ -n "${CHECKED_IN:-}" ] && [ "$CHECKED_IN" -gt "$BASELINE" ]; then
            echo "Xcode rewrote the project to $CHECKED_IN; regenerating to the $BASELINE baseline."
          else
            echo "Regenerating from project.yml (checked-in format ${CHECKED_IN:-missing})."
          fi

          xcodegen generate
          xcodegen --version

          GENERATED=$(version)
          echo "generated objectVersion: ${GENERATED:-missing}"

          if [ -z "${GENERATED:-}" ]; then
            echo "error: XcodeGen did not write an objectVersion" >&2
            exit 1
          fi
          if [ "$GENERATED" -gt "$BASELINE" ]; then
            echo "error: XcodeGen emitted $GENERATED, newer than the $BASELINE baseline" >&2
            exit 1
          fi

          if grep -q "RECOMMENDED_MACOSX_DEPLOYMENT_TARGET" "$PBXPROJ"; then
            echo 'error: deployment target was rewritten to $(RECOMMENDED_MACOSX_DEPLOYMENT_TARGET)' >&2
            exit 1
          fi
          if ! grep -q "MACOSX_DEPLOYMENT_TARGET = 27.0;" "$PBXPROJ"; then
            echo "error: expected MACOSX_DEPLOYMENT_TARGET = 27.0" >&2
            exit 1
          fi

      - name: Test package
        run: swift test -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "$CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Archive app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/GeometryStudio.xcarchive \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/GeometryStudio.xcarchive/Products/Applications/GeometryStudio.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "build/GeometryStudio-$VERSION.zip"

          xcrun notarytool submit "build/GeometryStudio-$VERSION.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          ditto -c -k --keepParent "$APP" "build/GeometryStudio-$VERSION.zip"
          (cd build && shasum -a 256 "GeometryStudio-$VERSION.zip" > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/GeometryStudio-$VERSION.zip" \
            "build/checksums.txt" \
            --title "Geometry Studio $VERSION" \
            --generate-notes
