name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Normalize Xcode project format
        run: |
          set -euo pipefail
          PBXPROJ=GeometryStudio.xcodeproj/project.pbxproj
          BASELINE=77

          version() {
            sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' "$PBXPROJ" | head -n 1
          }

          CHECKED_IN=$(version)
          echo "checked-in objectVersion: ${CHECKED_IN:-missing}"

          if [ -n "${CHECKED_IN:-}" ] && [ "$CHECKED_IN" -gt "$BASELINE" ]; then
            echo "Xcode rewrote the project to $CHECKED_IN; regenerating to the $BASELINE baseline."
          else
            echo "Regenerating from project.yml (checked-in format ${CHECKED_IN:-missing})."
          fi

          xcodegen generate
          xcodegen --version

          GENERATED=$(version)
          echo "generated objectVersion: ${GENERATED:-missing}"

          if [ -z "${GENERATED:-}" ]; then
            echo "error: XcodeGen did not write an objectVersion" >&2
            exit 1
          fi
          if [ "$GENERATED" -gt "$BASELINE" ]; then
            echo "error: XcodeGen emitted $GENERATED, newer than the $BASELINE baseline" >&2
            exit 1
          fi

      - name: Build package
        run: swift build -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Test package
        run: swift test -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Build app target
        run: |
          xcodebuild \
            -project GeometryStudio.xcodeproj \
            -scheme GeometryStudio \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Screenshot smoke test
        run: |
          ./.build/debug/GeometryStudio --screenshot "$RUNNER_TEMP/geometry-studio.png"
          test -s "$RUNNER_TEMP/geometry-studio.png"
