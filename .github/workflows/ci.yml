name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate checked-in project
        run: |
          set -euo pipefail
          PBXPROJ=GeometryStudio.xcodeproj/project.pbxproj

          VERSION=$(sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' "$PBXPROJ" | head -n 1)
          echo "checked-in objectVersion: ${VERSION:-missing}"
          if [ -z "${VERSION:-}" ]; then
            echo "error: $PBXPROJ has no objectVersion" >&2
            exit 1
          fi
          if [ "$VERSION" -lt 77 ]; then
            echo "error: objectVersion $VERSION is older than the 77 floor" >&2
            exit 1
          fi

          if grep -q "RECOMMENDED_MACOSX_DEPLOYMENT_TARGET" "$PBXPROJ"; then
            echo 'error: deployment target was rewritten to $(RECOMMENDED_MACOSX_DEPLOYMENT_TARGET)' >&2
            exit 1
          fi
          if ! grep -q "MACOSX_DEPLOYMENT_TARGET = 27.0;" "$PBXPROJ"; then
            echo "error: expected MACOSX_DEPLOYMENT_TARGET = 27.0" >&2
            exit 1
          fi

          # Xcode upgrades the project in place: upgrade check, dead-code
          # stripping, string-catalog symbols, script sandboxing, scheme
          # version. The build uses that project as checked in. Only the spec
          # is generated, into a scratch directory, so the upgrade survives.
          GENERATED="$RUNNER_TEMP/generated-project"
          mkdir -p "$GENERATED"
          xcodegen generate --spec project.yml --project "$GENERATED" --project-root "$PWD" --quiet
          test -d "$GENERATED/GeometryStudio.xcodeproj"

      - name: Build package
        run: swift build -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Test package
        run: swift test -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=110

      - name: Build app target
        run: |
          xcodebuild \
            -project GeometryStudio.xcodeproj \
            -scheme GeometryStudio \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Screenshot smoke test
        run: |
          ./.build/debug/GeometryStudio --screenshot "$RUNNER_TEMP/geometry-studio.png"
          test -s "$RUNNER_TEMP/geometry-studio.png"
